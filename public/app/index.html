<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f6fe5">
<title>FCC Attendance</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --page: #eaf2fc; --page-2: #dbe8fa; --panel: #ffffff; --card: #ffffff; --soft: #f5f7fa; --line: #e7ebf0;
  --ink: #10151c; --ink-2: #566070; --ink-3: #8a94a3;
  --accent: #1f6fe5; --accent-ink: #ffffff; --accent-soft: #e8f1fe; --dock: #141a24; --dock-line: transparent;
  --adults: #2a78d6; --kids: #1baf7a;
  --ok: #0ca30c; --ok-bg: #e6f6e6; --info: #2a78d6; --info-bg: #e8f1fe; --yellow: #fab219; --yellow-bg: #fff4d6;
  --red: #d03b3b; --red-bg: #fbe9e9;
  --shadow: 0 1px 2px rgba(16,21,28,.04), 0 8px 24px rgba(31,70,130,.07);
}
[data-theme="dark"] {
  --page: #0b0f14; --page-2: #0e141b; --panel: #11161d; --card: #151b23; --soft: #1b222c; --line: #232c38;
  --ink: #eef2f6; --ink-2: #a6b0be; --ink-3: #727d8c;
  --accent: #3987e5; --accent-ink: #ffffff; --accent-soft: #17273d; --dock: #1e2632; --dock-line: #2f3a4a;
  --adults: #3987e5; --kids: #199e70;
  --ok-bg: #12301a; --info: #3987e5; --info-bg: #17273d; --yellow-bg: #3a2e0c; --red-bg: #3a1717;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28);
}
* {box-sizing: border-box;}
html, body {margin: 0;}
body {font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); font-size: 15px;
      background: linear-gradient(160deg, var(--page), var(--page-2)); min-height: 100vh; -webkit-font-smoothing: antialiased;}
button {font: inherit; color: inherit; cursor: pointer;}
.shell {display: grid; grid-template-columns: 248px minmax(0, 1fr); gap: 20px; max-width: 1440px; margin: 0 auto; padding: 20px;}

/* sidebar */
.side {background: var(--panel); border-radius: 24px; padding: 18px 14px; box-shadow: var(--shadow); display: flex; overflow-y: auto;
       flex-direction: column; position: sticky; top: 20px; height: calc(100vh - 40px);}
.brand {display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; font-weight: 700;}
.brand-mark {width: 36px; height: 36px; border-radius: 12px; background: linear-gradient(135deg, #17616a, #2aa686);
             display: grid; place-items: center; color: #ffcf00; font-weight: 700;}
.side h6 {margin: 14px 10px 6px; font-size: 11px; letter-spacing: .08em; color: var(--ink-3); font-weight: 600;}
.nav {display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; color: var(--ink-2);
      font-weight: 500; text-decoration: none; border: 0; background: none; width: 100%; text-align: left;}
.nav:hover {background: var(--soft); color: var(--ink);}
.nav.on {background: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 16px rgba(31,111,229,.28);}
.nav svg {width: 19px; height: 19px; flex: none;}
.nav .count {margin-left: auto; background: var(--red); color: #fff; font-size: 11px; font-weight: 700; border-radius: 999px;
             padding: 2px 7px;}
.church {display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; color: var(--ink-2);
         border: 0; background: none; width: 100%; text-align: left; font-weight: 500;}
.church i {width: 8px; height: 8px; border-radius: 50%; background: var(--line);}
.church.on {color: var(--ink); background: var(--soft);} .church.on i {background: var(--accent);}
.side-foot {margin-top: auto; display: grid; gap: 2px;}
.nav.out {color: var(--red);}

/* main */
.main {background: var(--panel); border-radius: 24px; box-shadow: var(--shadow); min-width: 0; overflow: hidden;}
.top {display: flex; align-items: center; gap: 12px; padding: 16px 22px; border-bottom: 1px solid var(--line);}
.search {flex: 1; max-width: 320px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--line);
         border-radius: 999px; padding: 9px 14px; color: var(--ink-3); background: var(--card);}
.search svg {width: 17px; height: 17px;}
.top .gap {flex: 1;}
.icon-btn {width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--card);
           display: grid; place-items: center; color: var(--ink);}
.icon-btn svg {width: 18px; height: 18px;}
.mode {display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--card);
       border-radius: 999px; padding: 4px; }
.mode button {border: 0; background: none; border-radius: 999px; padding: 6px 12px; color: var(--ink-2); font-weight: 600;
              font-size: 13px; display: flex; align-items: center; gap: 6px;}
.mode button[aria-pressed="true"] {background: var(--accent); color: var(--accent-ink);}
.mode svg {width: 15px; height: 15px;}
.acct {display: flex; align-items: center; gap: 10px; background: var(--soft); border-radius: 999px; padding: 5px 14px 5px 5px;}
.acct-pic {width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #17616a, #2aa686); color: #fff;
           display: grid; place-items: center; font-weight: 700; font-size: 13px;}
.acct b {display: block; font-size: 13.5px; line-height: 1.2;} .acct small {color: var(--ink-3); font-size: 11.5px;}

.body {padding: 22px; background: var(--soft);}
.head {display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 18px;}
.head h1 {font-size: 28px; margin: 0; letter-spacing: -.02em; font-weight: 600;}
.head p {margin: 4px 0 0; color: var(--ink-2);}
.pill-btn {border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 10px 16px; font-weight: 500;
           display: inline-flex; align-items: center; gap: 8px;}
.pill-btn.primary {background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600;
                   box-shadow: 0 6px 16px rgba(31,111,229,.28);}
.pill-btn svg {width: 17px; height: 17px;}

.card {background: var(--card); border-radius: 20px; padding: 18px 20px; box-shadow: 0 1px 2px rgba(16,21,28,.03); min-width: 0;}
.card h2 {font-size: 17px; margin: 0; font-weight: 600;}
.card-head {display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap;}
.card-head .gap {flex: 1;}
.tiles {display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 14px;}
.tile .label {color: var(--ink-2); font-weight: 500; font-size: 14px;}
.tile .num {font-size: 34px; font-weight: 600; letter-spacing: -.03em; margin-top: 8px; font-variant-numeric: tabular-nums;}
.tile .num small {font-size: 13px; color: var(--ink-3); font-weight: 500; letter-spacing: 0; margin-left: 6px;}
.grid-2 {display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 14px; margin-bottom: 14px;}

/* chart */
.legend {display: flex; gap: 14px; font-size: 13px; color: var(--ink-2);}
.legend i {display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px;}
.chart {position: relative;}
.chart svg {width: 100%; height: auto; display: block; overflow: visible;}
.chart text {font-family: inherit; fill: var(--ink-3); font-size: 11px;}
.chart .total {fill: var(--ink-2); font-weight: 600;}
.chart .gridline {stroke: var(--line); stroke-width: 1;}
.chart .hit {fill: transparent; cursor: pointer;} .chart g.col:hover .hit, .chart g.col:focus .hit {fill: var(--soft);}
.tip {position: absolute; pointer-events: none; background: var(--ink); color: var(--panel); border-radius: 12px;
      padding: 9px 12px; font-size: 12.5px; line-height: 1.5; white-space: nowrap; transform: translate(-50%, -110%);
      opacity: 0; transition: opacity .12s; z-index: 2;}
.tip b {font-size: 13px;} .tip i {display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px;}
details.table {margin-top: 10px; font-size: 13px; color: var(--ink-2);} details.table summary {cursor: pointer;}
details.table table {margin-top: 8px;}

/* status */
.status-row {display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line);}
.status-row:last-child {border-bottom: 0;}
.stand {display: flex; flex-direction: column; gap: 10px;} .stand-rows {min-width: 0;}
.donut {position: relative; align-self: center;} .donut svg {display: block; width: 150px; height: 150px;}
.donut text {fill: var(--ink-3); font-size: 11px; pointer-events: none;} .donut text.big {fill: var(--ink); font-size: 26px; font-weight: 600;}
.donut .seg {cursor: pointer; outline: none; transition: stroke-width .12s;} .donut .seg:hover, .donut .seg:focus-visible {stroke-width: 20;}
.donut .tip {transform: translate(-50%, -100%); white-space: nowrap;}
.cal {display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center;}
.cal b {font-size: 12px; font-weight: 500; color: var(--ink-3); padding: 4px 0 8px;}
.day {border: 0; background: none; font: inherit; color: var(--ink-2); border-radius: 12px; min-height: 46px; display: grid; align-content: center; justify-items: center;
      line-height: 1.15; cursor: pointer; font-variant-numeric: tabular-nums;}
.day small {font-size: 10.5px; font-weight: 600; color: var(--accent);}
.day:hover {background: var(--soft);} .day.has {background: var(--accent-soft); color: var(--ink); font-weight: 600;}
.day.today {box-shadow: inset 0 0 0 2px var(--accent);}
.day:focus-visible {outline: 3px solid var(--accent-soft); outline-offset: 1px;}
.icon-btn.sm {width: 34px; height: 34px;}
@media (prefers-reduced-motion: reduce) { .donut .seg {transition: none;} }
.status-row .txt {flex: 1; min-width: 0;} .status-row .txt small {display: block; color: var(--ink-3); font-size: 12.5px;}
.status-row b {font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums;}
.badge {display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 10px; font-size: 12.5px;
        font-weight: 600; color: var(--ink); white-space: nowrap; background: var(--soft);}
.badge::before {content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor;}
.badge.ok {background: var(--ok-bg);} .badge.ok::before {background: var(--ok);}
.badge.blue {background: var(--info-bg);} .badge.blue::before {background: var(--info);}
.badge.yellow {background: var(--yellow-bg);} .badge.yellow::before {background: var(--yellow);}
.badge.red {background: var(--red-bg);} .badge.red::before {background: var(--red);}

/* services strip */
.strip {display: flex; gap: 14px; overflow-x: auto; padding-bottom: 4px;}
.day {text-align: center; flex: none; width: 44px; color: var(--ink-3); font-size: 12px;}
.day span {display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; margin: 6px auto 0;
           background: var(--soft); color: var(--ink-3); font-weight: 600; font-size: 12px;}
.day.done span {background: var(--ok); color: #fff;} .day.now span {outline: 2px solid var(--accent); outline-offset: 2px;}

/* table */
table {width: 100%; border-collapse: collapse;}
th {text-align: left; font-size: 12.5px; color: var(--ink-3); font-weight: 500; padding: 10px 12px; background: var(--soft); white-space: nowrap;}
td select.in {min-width: 124px;} td input.in {min-width: 150px;}  /* boxes in a table keep a readable width; the table scrolls sideways if it must */
.found {display: grid; gap: 4px; margin-top: 8px;} .found .who {padding: 8px 6px; border-radius: 12px;} .found .who:hover {background: var(--soft);}
th:first-child {border-radius: 12px 0 0 12px;} th:last-child {border-radius: 0 12px 12px 0;}
td {padding: 13px 12px; border-bottom: 1px solid var(--line); white-space: nowrap;}
tr:last-child td {border-bottom: 0;}
td.muted {color: var(--ink-2);}
.who {display: flex; align-items: center; gap: 10px;}
.who span {width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid;
           place-items: center; font-size: 12px; font-weight: 700; flex: none;}
.scroll {overflow-x: auto;}
.note {margin: 16px 2px 0; color: var(--ink-3); font-size: 12.5px;}
button.who, button.acct {border: 0; font: inherit; color: inherit; text-align: left; cursor: pointer;}
button.who {background: none; padding: 0;} button.who:hover, button.who.sel {color: var(--accent);} button.who.sel {font-weight: 700;}
button.acct:hover {background: var(--accent-soft);}
.who.big {font-size: 20px; font-weight: 700;} .who.big span {width: 42px; height: 42px; font-size: 15px;}
.facts {margin: 4px 2px 0; color: var(--ink-2); font-size: 14px; line-height: 1.6;}
.num.sm {font-size: 20px !important; line-height: 1.5;}
.year {margin: 16px 2px 10px; font-size: 13.5px; color: var(--ink-2);} .year:first-of-type {margin-top: 0;}
.dots {display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px;} .dots > div {display: grid; justify-items: center; gap: 6px; flex: 1; min-width: 46px;}
.dots small {font-size: 11px; color: var(--ink-3); white-space: nowrap;}
.dot {display: inline-block; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); background: none;}
.dot.on {background: var(--accent); border-color: var(--accent);}
.legend .dot {width: 10px; height: 10px; border-width: 2px; margin-right: 6px; border-radius: 50%;}
.check {display: flex; align-items: center; gap: 10px; font-weight: 500;} .check input {width: 20px; height: 20px; accent-color: var(--accent); flex: none;}
textarea.in {width: 100%; resize: vertical; font: inherit;}
.church span {flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
.church em {font-style: normal; font-size: 12px; font-weight: 600; color: var(--accent);} .church[data-view] {cursor: pointer;}
.branches {display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px;}
.branch.here {box-shadow: inset 0 0 0 2px var(--accent);}
.branch .facts {min-height: 22px; margin: -6px 0 12px;}
.branch-main {display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;}
.branch-main .num {font-size: 34px; font-weight: 600; letter-spacing: -.03em; font-variant-numeric: tabular-nums;}
.branch-main .num small {font-size: 13px; color: var(--ink-3); font-weight: 500; letter-spacing: 0; margin-left: 6px;}
.stats {display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 8px; margin: 14px 0 0;}
.stats dt {font-size: 12px; color: var(--ink-3);} .stats dd {margin: 2px 0 0; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums;}
.back {display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; color: var(--accent); font: inherit; font-weight: 600;
       padding: 6px 2px; margin: -4px 0 10px; cursor: pointer;} .back svg {width: 18px; height: 18px;}
/* popup (WhatsApp messages) */
.modal {position: fixed; inset: 0; z-index: 30; background: rgba(10, 16, 28, .55); display: grid; place-items: center; padding: 16px; overflow-y: auto;}
.sheet {width: min(860px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 22px;
        box-shadow: 0 30px 80px rgba(8, 15, 30, .45);}
.sheet .card-head h2 {font-size: 20px;}
.modal-grid {display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 16px; align-items: start;}
.opts {display: grid; gap: 12px;}
.switch, .opt {display: block; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px;}
.switch {display: flex; align-items: center; gap: 14px; cursor: pointer;}
.switch span {flex: 1;} .switch b {display: block; font-weight: 600;} .switch small {color: var(--ink-3); font-size: 12.5px;}
.switch input {position: absolute; opacity: 0; width: 1px; height: 1px;}
.switch i {flex: none; width: 46px; height: 28px; border-radius: 999px; background: var(--line); position: relative; transition: background .15s;}
.switch i::after {content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff;
                  box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .15s;}
.switch input:checked + i {background: var(--accent);} .switch input:checked + i::after {transform: translateX(18px);}
.switch input:focus-visible + i {outline: 3px solid var(--accent-soft); outline-offset: 2px;}
.opt .f {display: block;}
.preview {margin: 6px 0 0; white-space: pre-wrap; word-break: break-word; font: 14px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
          background: var(--soft); border-radius: 12px; padding: 14px; max-height: 46vh; overflow-y: auto; color: var(--ink); user-select: text; -webkit-user-select: text;}
.tag {display: inline-block; background: var(--accent-soft); color: var(--ink); border-radius: 999px; padding: 3px 9px; font-size: 12.5px; font-weight: 500; margin: 1px 4px 1px 0;}
.suggest {display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px;} .suggest:empty {display: none;} .chip.sm {padding: 5px 11px; font-size: 13px;}
.bulk > * {white-space: nowrap;} .bulk {flex-wrap: wrap; display: flex; align-items: center; gap: 8px; position: sticky; top: 8px; z-index: 5; background: var(--card); border: 1px solid var(--accent); border-radius: 14px; padding: 8px 10px 8px 14px; margin-bottom: 12px; box-shadow: 0 6px 18px rgba(0,0,0,.12);}
.bulk .gap {flex: 1;} .tick {width: 36px;} .tick input {width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer;}
.sheet.narrow {width: min(520px, 100%);} .fields {display: grid; gap: 14px;} .fields .f {display: block;}
.pill-btn.sm {padding: 7px 12px; font-size: 13.5px;} .chip svg {width: 14px; height: 14px; margin-left: 8px; vertical-align: -2px; opacity: .6;}
button.chip {cursor: pointer; font: inherit; font-weight: 500;} button.chip:not(.on):hover {border-color: var(--accent); color: var(--accent);}
.modal-foot {display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px;} .modal-foot .pill-btn {justify-content: center; padding: 13px 16px;}
@media (max-width: 720px) { .modal {place-items: end center; padding: 0;} .sheet {border-radius: 24px 24px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); max-height: 92vh; overflow-y: auto;}
  .modal-grid {grid-template-columns: 1fr;} .preview {max-height: 34vh;} }
@media (prefers-reduced-motion: reduce) { .switch i, .switch i::after {transition: none;} }

/* phone and tablet: a menu button sits by the thumb at the bottom right; the sidebar slides in from that side */
.dock, .scrim {display: none;}
@media (max-width: 1080px) {
  .shell {grid-template-columns: 1fr; padding: 12px; gap: 12px;}
  /* a dark bar at the bottom, by the thumb: the four most-used pages and More (which opens the full menu) */
  .dock {display: flex; align-items: center; justify-content: space-between; gap: 4px; position: fixed; left: 12px; right: 12px;
         bottom: calc(10px + env(safe-area-inset-bottom)); max-width: 520px; margin: 0 auto; z-index: 18; padding: 8px;
         background: var(--dock); border: 1px solid var(--dock-line); border-radius: 26px;
         box-shadow: 0 16px 36px rgba(8, 15, 30, .38), 0 2px 6px rgba(8, 15, 30, .22);}
  .dock button {border: 0; background: none; color: #aab4c3; height: 48px; min-width: 48px; padding: 0 12px; border-radius: 18px;
                display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 14px;}
  .dock svg {width: 22px; height: 22px; flex: none;}
  .dock span {display: none;}
  .dock button.on {background: var(--accent); color: #fff; padding: 0 16px;} .dock button.on span {display: inline;}
  body {padding-bottom: calc(92px + env(safe-area-inset-bottom));}
  .side {position: fixed; top: 0; right: 0; bottom: 0; height: auto; width: min(290px, 84vw); border-radius: 24px 0 0 24px;
         z-index: 20; overflow-y: auto; transform: translateX(105%); visibility: hidden;
         transition: transform .2s ease, visibility .2s; padding-top: calc(18px + env(safe-area-inset-top));
         padding-bottom: calc(18px + env(safe-area-inset-bottom));}
  .shell.open .side {transform: none; visibility: visible;}
  .shell.open .scrim {display: block; position: fixed; inset: 0; background: rgba(10, 16, 28, .45); z-index: 19;}
  .tiles {grid-template-columns: repeat(2, minmax(0, 1fr));}
  .grid-2 {grid-template-columns: 1fr;}
  @media (prefers-reduced-motion: reduce) { .side {transition: none;} }
}
@media (max-width: 640px) {
  .top {padding: 12px 14px; flex-wrap: wrap;} .search {display: none;} .acct span:last-child, .mode button span {display: none;} .acct {padding: 4px;}
  .chart text {font-size: 12px;}
  .body {padding: 14px;} .head h1 {font-size: 23px;} .tile .num {font-size: 28px;} .card {padding: 15px;}
  .hide-sm {display: none;}
}

/* ---- app additions */
[hidden] {display: none !important;}
.center {min-height: 100vh; display: grid; place-items: center; padding: 20px;}
.login {width: min(420px, 100%); background: var(--panel); border-radius: 24px; box-shadow: var(--shadow); padding: 28px;}
.login h1 {font-size: 22px; margin: 14px 0 4px;} .login p {color: var(--ink-2); margin: 0 0 16px;}
label.f {display: block; font-size: 13px; color: var(--ink-2); font-weight: 500; margin: 12px 0 6px;}
input.in, select.in {width: 100%; font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line);
  border-radius: 14px; padding: 11px 14px; outline: none;}
input.in:focus, select.in:focus {border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);}
.pill-btn:disabled {opacity: .55; cursor: default;}
.pill-btn.block {width: 100%; justify-content: center; margin-top: 16px;}
.link {background: none; border: 0; color: var(--accent); font-weight: 600; padding: 0; margin-top: 14px;}
.msg {border-radius: 14px; padding: 11px 14px; font-size: 14px; margin-top: 14px; background: var(--accent-soft); color: var(--ink);}
.msg.bad {background: var(--red-bg);}
.chips {display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px;}
.chip {border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 14px; font-weight: 500; color: var(--ink-2);}
.chip.on {background: var(--accent); color: var(--accent-ink); border-color: transparent;}
.row {display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end;} .row > * {flex: 1; min-width: 150px;}
.names {display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 14px;}
.name {display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line);
       background: var(--card); cursor: pointer; min-width: 0; user-select: none;}
.name input {width: 20px; height: 20px; accent-color: var(--accent); flex: none;}
.name span {white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
.name small {color: var(--ink-3); margin-left: auto; flex: none; font-size: 12px;}
.name.on {background: var(--accent-soft); border-color: transparent;}
.toast {position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); z-index: 40; transform: translateX(-50%); background: var(--ink); color: var(--panel);
        border-radius: 14px; padding: 11px 16px; font-size: 14px; z-index: 9; max-width: 90vw;}
.empty {color: var(--ink-3); padding: 18px 4px;}
td .x {border: 0; background: none; color: var(--red); font-weight: 600;}
.spark {display: inline-flex; align-items: flex-end; gap: 2px; height: 22px;} .spark i {width: 5px; background: var(--adults); border-radius: 2px 2px 0 0;}
@media (max-width: 900px) { .names {grid-template-columns: repeat(2, minmax(0, 1fr));} }
@media (max-width: 560px) { .names {grid-template-columns: 1fr;} }
.dock button {white-space: nowrap;}
@media (max-width: 380px) {.dock {left: 8px; right: 8px;} .dock button {padding: 0 8px; min-width: 42px;} .dock button.on {padding: 0 12px; font-size: 13.5px; gap: 6px;}}
</style>
</head>

<div id="root"><div class="center"><p class="empty">Loading…</p></div></div>
<script type="module" src="app.js"></script>
</body>
